<!doctype html>
<html>
  <head>
    <title>{{ title|default('Свояк', true) }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
  </head>
  <body onload="init_page()">
    <div class="container">
      <div class="d-flex justify-content-end align-items-center gap-2 small text-muted pt-2">
        {% if current_user %}
          <span>{{ current_user.name }} · {{ current_user.role }}</span>
          <form method="post" action="/logout" class="m-0">
            <button class="btn btn-link btn-sm p-0" type="submit">Выйти</button>
          </form>
        {% else %}
          <a href="/login">Войти</a>
        {% endif %}
      </div>
      <h1>{{ title|default('Свояк', true) }}</h1>
      <hr>
      {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
