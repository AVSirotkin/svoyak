{% extends "base.html" %}

{% block content %}

{% if roomid == 0 %}
<h1>Инициализация свободной комнаты</h1>
{% else %}
<h1>Инициализация комнаты {{roomid}} </h1>
{% endif %}
<!-- <a href = "/room/{{roomid}}"><h1>Вернуться в комнату</h1></a>  -->

Дата игры: <input type="date" id="game_date" name="game_date" value="2024-09-01" min="2020-01-01" /><br>
Площадка: <select id="game_venue" name="game_venue">
    <option value="0">Без площадки</option>
    {% for ven in venues %}    <option value="{{ven.venueid}}"> {{ven.venuename}} </option>
    {% endfor %}
    </select><br>

Схема: <select id="game_format" name="game_format">
    <!-- <option value="0" selected>свободная посадка 3 игры</option> -->
    <!-- <option value="1" selected>свободная посадка 3 игры</option>
    <option value="2">свободная посадка 4 игры</option>
    <option value="3">2 игры + финал</option>
    <option value="4">3 игры + финал</option>
    <option value="5">DE на 8 игроков</option> -->
    {% for rul in rules %}    <option value="{{rul.rulesid}}" data-tables="{{rul.max_tables}}"> {{rul.description}} </option>
    {% endfor %}
    </select><br>

<div id="tables_row" style="display:none">
    Столов: <select id="game_tables" name="game_tables"></select>
    <span id="tables_hint"></span><br>
    <label style="display:inline-block;margin-top:6px">
        <input type="checkbox" id="half_minus" name="half_minus">
        Половинные минусы за неверный ответ
    </label><br>
</div>
    
<button onclick="assign()">Настроить комнату</button>
{% endblock %}
<!-- Выбрать формат:<br>

свободная посадка 2 игры<br>
свободная посадка 3 игры<br>
свободная посадка 4 игры<br>
2 игры + финал<br>
3 игры + финал<br>
DE на 8 человек<br> -->
{% block scripts %}
<script>
    function localDateISO(d){
        // toISOString() даёт UTC: поздним вечером по Москве это был бы вчерашний день.
        const shifted = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return shifted.toISOString().slice(0, 10);
    }

    function init_page(){
        const de = document.getElementById("game_date");
        const now = new Date();
        de.value = localDateISO(now);
        // Раньше max был зашит как 2026-12-31 и со временем заблокировал бы создание комнат.
        de.max = localDateISO(new Date(now.getTime() + 365 * 24 * 3600 * 1000));
        document.getElementById("game_format").addEventListener("change", syncTables);
        syncTables();
    }

    // Сколько столов допускает выбранная схема. По умолчанию ставим один:
    // так играли раньше, а ведущий поднимает число осознанно.
    function syncTables(){
        const format = document.getElementById("game_format");
        const option = format.options[format.selectedIndex];
        const capacity = parseInt(option ? option.dataset.tables : "1", 10) || 1;
        const row = document.getElementById("tables_row");
        const select = document.getElementById("game_tables");
        const hint = document.getElementById("tables_hint");

        select.innerHTML = "";
        for (let i = 1; i <= capacity; i++) {
            const item = document.createElement("option");
            item.value = String(i);
            item.textContent = String(i);
            select.appendChild(item);
        }
        select.value = "1";

        if (capacity > 1) {
            row.style.display = "";
            hint.textContent = "схема допускает до " + capacity;
        } else {
            row.style.display = "none";
            hint.textContent = "";
        }
    }

    function assign(){
        // var conf = confirm("Вы подтверждаете привязку "+name+ " с id "+rowid);
        // if (conf){
            var re = document.getElementById("game_format");
            var rvalue = re.value;
            console.log(rvalue)
            var e = document.getElementById("game_venue");
            var value = e.value;
            var de = document.getElementById("game_date");
            var dvalue = de.value;
            var te = document.getElementById("game_tables");
            var tvalue = te ? te.value : "1";

            let ans = fetch("/api/addroom",
                {   
                    headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                    },
                    method: "POST",
                    body: JSON.stringify({venueid: value, roomid:{{roomid}}, date: dvalue, rulesid:rvalue, tables:tvalue, half_minus: document.getElementById('half_minus').checked})
                }).then((response) => {
                    if (response.status === 401) {
                        document.location.href = "/login?next=" + encodeURIComponent(document.location.pathname);
                        return null;
                    }
                    return response.json().then((data) => {
                        
                        if (data.Status == "Ok"){
                            alert("Комната успешно создана");
                            var loc_ref = "/room/"+ data.RoomId
                            document.location.href = loc_ref}
                        else {alert("Невозможно занять комнату. Причина: "+ data.Status);
                        // window.location.replace("/room/{{roomid}}");
                        }

                        return data;
                    }).catch((err) => {
                        console.log(err);
                    }) 
                });
        // }
    }




</script>
{% endblock %}
