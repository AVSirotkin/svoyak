    <script>
        // bracket-renderer.js – универсальный рендерер турнирной сетки
// с поддержкой детальных карточек (очки, баллы) для завершённых матчей

function renderBracket(schema, completedMatches, container, options = {}) {
    const containerEl = typeof container === 'string' ? document.getElementById(container) : container;
    if (!containerEl) return;
    const activePlayers = options.activePlayers || []; // массив имён
    // Глубокая копия матчей с состоянием
    console.log("d", schema.matches)

    const matches = schema.matches.map(m => ({
        id: m.id,
        name: m.name || m.id,
        participantSlots: m.participantSlots,
        sources: m.sources || [],
        virtual: m.virtual === true,
        type: m.type || 'match',
        aggregateBy: m.aggregateBy || 'sum',
        outputSlots: m.outputSlots || null,
        defaultRanking: m.defaultRanking || null,
        participants: new Array(m.participantSlots).fill(null),
        results: null,
        completedData: null,
        completed: false,
        participants: new Array(m.participantSlots).fill(null)
    }));


    matches.forEach(m => {
        if (m.type === 'seed') {
            for (let i = 0; i < Math.min(m.participantSlots, activePlayers.length); i++) {
                m.participants[i] = activePlayers[i];
            }
            // остальные слоты остаются null
        } else {
            // для обычных матчей заполняем из sources типа 'player'
            m.sources.forEach(src => {
                if (src.type === 'player') m.participants[src.slot-1] = src.name;
            });
        }
    });

    // ---- Вспомогательные функции (те же, что и ранее) ----
    function getMatchCompletedData(matchId) {
        return completedMatches.find(cm => cm.gameindex == matchId);
    }

    function applyResults() {
        
        matches.forEach(m => {
            if (m.virtual && !m.results && m.type !== 'aggregator') {
                let order = m.participants.slice();
                if (m.defaultRanking) {
                    order = m.defaultRanking.map(slot => m.participants[slot-1]);
                }
                m.results = order.filter(p => p);
                m.completed = true;
            }
        });

        matches.forEach(m => {
            if (m.type === 'seed') return;
            if (m.results) return;
            if (m.type === 'aggregator') return;
            const apiData = getMatchCompletedData(m.id);
            if (apiData && apiData.scores && apiData.scores.length === m.participantSlots) {
                m.completedData = apiData;
                m.completed = true;
                const sorted = [...apiData.scores].sort((a,b) => a.position - b.position);
                m.results = sorted.map(s => s.name);
                for (let i = 0; i < sorted.length; i++) {
                    m.participants[i] = sorted[i].name;
                }
            }
        });
    }

    function computeAggregator(agg) {
        const playerPoints = new Map();
        let allSourcesCompleted = true;
        for (let src of agg.sources) {
            if (src.type !== 'match') continue;
            const sourceMatch = matches.find(m => m.id === src.matchId);
            if (!sourceMatch || !sourceMatch.completed) {
                allSourcesCompleted = false;
                break;
            }
            const scores = sourceMatch.completedData?.scores;
            if (scores) {
                scores.forEach(score => {
                    const points = (src.field === 'points') ? (score.points || 0) : (score.score || 0);
                    const current = playerPoints.get(score.name) || 0;
                    playerPoints.set(score.name, current + points);
                });
            }
        }
        if (!allSourcesCompleted) return null;
        const sorted = Array.from(playerPoints.entries())
            .map(([name, total]) => ({ name, total }))
            .sort((a,b) => b.total - a.total);
        let results = sorted.map(item => item.name);
        if (agg.participantSlots && agg.participantSlots < results.length) {
            results = results.slice(0, agg.participantSlots);
        }
        const fakeScores = results.map((name, idx) => ({
            name: name,
            position: idx + 1,
            score: 0,
            points: sorted.find(s => s.name === name)?.total || 0
        }));
        return { results, participants: results.slice(), fakeScores };
    }

    function updateAggregators() {
        let changed = true;
        while (changed) {
            changed = false;
            for (let agg of matches.filter(m => m.type === 'aggregator')) {
                if (agg.completed) continue;
                const computed = computeAggregator(agg);
                if (computed) {
                    agg.results = computed.results;
                    agg.participants = computed.participants;
                    agg.completed = true;
                    agg.completedData = { gameindex: agg.id, scores: computed.fakeScores };
                    changed = true;
                }
            }
        }
    }

    function buildReverseLinks() {
        const map = new Map();
        matches.forEach(m => {
            m.sources.forEach(src => {
                if (src.type === 'match') {
                    if (!map.has(src.matchId)) map.set(src.matchId, []);
                    map.get(src.matchId).push({
                        targetMatchId: m.id,
                        targetSlot: src.slot,
                        place: src.place
                    });
                }
            });
        });
        return map;
    }

function propagateParticipants(reverseLinks) {
    let changed = true;
    while (changed) {
        changed = false;
        for (let m of matches) {
            // Распространяем только если:
            // - это seed-матч, ИЛИ
            // - матч завершён (completed === true)
            const canPropagate = (m.type === 'seed') || (m.completed === true);
            if (!canPropagate) continue;
            
            // Если у матча нет участников – пропускаем
            if (!m.participants || m.participants.every(p => !p)) continue;
            
            const dependents = reverseLinks.get(m.id) || [];
            for (let dep of dependents) {
                const target = matches.find(t => t.id === dep.targetMatchId);
                if (target && !target.completed) {
                    const playerName = m.participants[dep.place - 1];
                    if (playerName && target.participants[dep.targetSlot - 1] !== playerName) {
                        target.participants[dep.targetSlot - 1] = playerName;
                        changed = true;
                    }
                }
            }
        }
    }
}
    

    function computeLevels() {
        const levels = new Map();
        function getLevel(matchId) {
            if (levels.has(matchId)) return levels.get(matchId);
            const match = matches.find(m => m.id === matchId);
            if (!match) return 0;
            let maxLevel = -1;
            match.sources.forEach(src => {
                if (src.type === 'match') {
                    const lvl = getLevel(src.matchId);
                    if (lvl > maxLevel) maxLevel = lvl;
                }
            });
            const level = maxLevel + 1;
            levels.set(matchId, level);
            return level;
        }
        matches.forEach(m => getLevel(m.id));
        return levels;
    }

    function groupByLevels(levels) {
        const groups = new Map();
        matches.forEach(m => {
            const lvl = levels.get(m.id);
            if (!groups.has(lvl)) groups.set(lvl, []);
            groups.get(lvl).push(m);
        });
        const sortedLevels = Array.from(groups.keys()).sort((a,b) => a-b);
        return sortedLevels.map(lvl => groups.get(lvl));
    }
    
    function renderSeedCard(match) {
        const card = document.createElement('div');
        card.className = 'seed-card';
        card.innerHTML = `<div class="match-title">${escapeHtml(match.name)}</div>`;
        const list = document.createElement('div');
        list.className = 'seed-players-list';
        for (let i = 0; i < match.participantSlots; i++) {
            const player = match.participants[i] || '—';
            list.innerHTML += `
                <div class="seed-player-row">
                    <span class="seed-slot">${i+1}</span>
                    <span class="seed-name">${escapeHtml(player)}</span>
                </div>
            `;
        }
        card.appendChild(list);
        if (!options.readOnly && options.onSeedUpdate) {
            const refreshBtn = document.createElement('button');
            refreshBtn.textContent = '🔄 Обновить посев';
            refreshBtn.className = 'seed-refresh-btn';
            refreshBtn.onclick = () => options.onSeedUpdate();
            card.appendChild(refreshBtn);
        }
        return card;
    }
    // ========== НОВАЯ ФУНКЦИЯ РЕНДЕРА КАРТОЧКИ (с очками и баллами) ==========
    function renderMatchCard(match) {

        if (match.type === 'seed') {
            return renderSeedCard(match);
        }
        // Если матч завершён и есть детальные данные – используем красивую карточку
        if (match.completed && match.completedData && match.completedData.scores) {
            const game = match.completedData;
            const card = document.createElement('div');
            card.className = 'game-card past';
            
            // Сортируем игроков по занятым местам
            const sortedPlayers = [...game.scores].sort((a, b) => a.position - b.position);
            
            let playersHtml = '';
            sortedPlayers.forEach(player => {
                const scoreClass = player.score >= 0 ? 'positive-score' : 'negative-score';
                playersHtml += `
                    <div class="gc-player-row">
                        <span class="gc-player-place place-${player.position}">${player.position}</span>
                        <span class="gc-player-name" title="${player.name}">${escapeHtml(player.name)}</span>
                        <span class="gc-player-score ${scoreClass}">${player.score > 0 ? '+' : ''}${player.score}</span>
                        <span class="gc-player-points">${(player.points || 0).toFixed(2)}</span>
                    </div>
                `;
            });
            
            card.innerHTML = `
                <div class="game-header">
                    <span class="gc-game-id">${escapeHtml(match.name)}</span>
                    <span class="gc-game-type">${match.type === 'aggregator' ? 'агрегатор' : (match.virtual ? 'виртуальная' : 'обычная')}</span>
                </div>
                <div class="gc-players-container">
                    <div class="gc-players-column">
                        ${playersHtml}
                    </div>
                </div>
                <div class="game-footer">
                    ${match.type === 'aggregator' ? '📊 Сумма баллов' : '✔ Завершена'}
                </div>
            `;
            
            // Добавляем кнопки действий (если нужно)
            if (!options.readOnly && match.type !== 'aggregator' && !match.virtual) {
                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️ Редактировать';
                editBtn.className = 'match-action-btn';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (options.onPlayMatch) options.onPlayMatch(match.id, match.participants.slice(), true);
                };
                card.querySelector('.game-footer').appendChild(editBtn);
            }
            
            if (options.onShowDetails) {
                const detailsBtn = document.createElement('button');
                detailsBtn.textContent = '📋 Детали';
                detailsBtn.className = 'match-details-btn';
                detailsBtn.onclick = (e) => {
                    e.stopPropagation();
                    options.onShowDetails(match.id, game);
                };
                card.querySelector('.game-footer').appendChild(detailsBtn);
            }
            
            return card;
        }
        
        // ---------- Для незавершённых или виртуальных матчей (без данных) используем упрощённую карточку ----------
        const card = document.createElement('div');
        card.className = `match-card ${match.virtual ? 'virtual' : ''} ${match.type === 'aggregator' ? 'aggregator' : ''}`;
        
        const title = document.createElement('div');
        title.className = 'match-title';
        title.textContent = match.name;
        card.appendChild(title);
        
        const participantsDiv = document.createElement('div');
        participantsDiv.className = 'match-participants';
        for (let i = 0; i < match.participantSlots; i++) {
            const slot = document.createElement('div');
            slot.className = 'participant-slot';
            let name = match.participants[i];
            if (!name && match.results && match.results[i]) name = match.results[i];
            slot.textContent = name || '—';
            participantsDiv.appendChild(slot);
        }
        card.appendChild(participantsDiv);
        
        // Кнопка "Играть" для доступных матчей
        if (!options.readOnly) {
            const isPlayable = !match.completed && match.type !== 'aggregator' && !match.virtual && match.participants.every(p => p && p !== '—');
            if (isPlayable) {
                const playBtn = document.createElement('button');
                playBtn.textContent = '🎮 Играть';
                playBtn.className = 'match-action-btn';
                playBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (options.onPlayMatch) options.onPlayMatch(match.id, match.participants.slice(), false);
                };
                card.appendChild(playBtn);
            }
        }
        
        return card;
    }

    // Экранирование HTML (для безопасности)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ---- Основной процесс ----
    applyResults();
    updateAggregators();
    const reverseLinks = buildReverseLinks();
    propagateParticipants(reverseLinks);
    const levels = computeLevels();
    const rounds = groupByLevels(levels);
    
    containerEl.innerHTML = '';
    rounds.forEach(roundMatches => {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'bracket-round';
        roundMatches.forEach(match => {
            roundDiv.appendChild(renderMatchCard(match));
        });
        containerEl.appendChild(roundDiv);
    });
}

// Экспорт (если используется модульная система)
if (typeof module !== 'undefined' && module.exports) {
    module.exports = { renderBracket };
} else {
    window.renderBracket = renderBracket;
}
    </script>

    <script>
        let draggedPanel = null;

        function panelDragStart(event) {
            // Разрешаем перетаскивание, только если цель - сам заголовок или его дети (но не кнопка)
            const header = event.target.closest('.panel-header');
            if (!header) {
                event.preventDefault();
                return false;
            }
            // Если цель - кнопка развёртывания, отменяем перетаскивание
            if (event.target.closest('.panel-expand')) {
                event.preventDefault();
                return false;
            }
            
            draggedPanel = header.closest('.panel');
            if (!draggedPanel) return;
            
            event.dataTransfer.setData('text/plain', draggedPanel.id);
            event.dataTransfer.effectAllowed = 'move';
            draggedPanel.classList.add('dragging');
        }
        function panelDragOver(event) {
            event.preventDefault(); // Разрешаем сброс
            event.dataTransfer.dropEffect = 'move';
        }

        function panelDrop(event) {
            event.preventDefault();
            const targetPanel = event.target.closest('.panel');
            if (!targetPanel || !draggedPanel || targetPanel === draggedPanel) return;
            
            // Меняем местами блоки в DOM
            const container = document.getElementById('panels-container');
            const panels = Array.from(container.children);
            const draggedIndex = panels.indexOf(draggedPanel);
            const targetIndex = panels.indexOf(targetPanel);
            
            if (draggedIndex < targetIndex) {
                targetPanel.after(draggedPanel);
            } else {
                targetPanel.before(draggedPanel);
            }
            
            // Сохраняем новый порядок
            savePanelsOrder();
            
            draggedPanel.classList.remove('dragging');
            draggedPanel = null;
        }

        function panelDragEnd(event) {
            if (draggedPanel) {
                draggedPanel.classList.remove('dragging');
                draggedPanel = null;
            }
        }

        // Сохранение порядка блоков в localStorage
        function savePanelsOrder() {
            const container = document.getElementById('panels-container');
            const panelIds = Array.from(container.querySelectorAll('.panel')).map(panel => panel.id);
            localStorage.setItem('panels_order', JSON.stringify(panelIds));
        }

        // Восстановление порядка блоков при загрузке
        function restorePanelsOrder() {
            const savedOrder = localStorage.getItem('panels_order');
            if (!savedOrder) return;
            
            const container = document.getElementById('panels-container');
            const panelIds = JSON.parse(savedOrder);
            const panelsMap = new Map();
            container.querySelectorAll('.panel').forEach(panel => {
                panelsMap.set(panel.id, panel);
            });
            
            panelIds.forEach(panelId => {
                const panel = panelsMap.get(panelId);
                if (panel) container.appendChild(panel); // перемещаем в конец в нужном порядке
            });
        }

        // Инициализация drag & drop для контейнера
        document.getElementById('panels-container').addEventListener('dragover', panelDragOver);
        document.getElementById('panels-container').addEventListener('drop', panelDrop);

        // Восстанавливаем порядок при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            restorePanelsOrder();
        });

                incorrectBtn.className = 'player-button incorrect-button';

        function toggleTableView() {

                renderHorizontalTable();
            } else {
                btn.textContent = 'Горизонтальное отображение';
                renderVerticalTable();
            }
            
            updateQuestionHighlight();
        }

        function renderHorizontalTable() {

            table.className = 'score-table horizontal';
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');

            tableBody.innerHTML = '';

        // Рендер вертикальной таблицы
        function renderVerticalTable() {
            const table = document.getElementById('scoreTable');
            table.className = 'score-table vertical';
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');
            
            // Очищаем таблицу
            headerRow.innerHTML = '';
            tableBody.innerHTML = '';

            thValue.textContent = " ";

        // Обновление подсветки текущего вопроса
        function updateQuestionHighlight() {
            // Убираем предыдущую подсветку
            document.querySelectorAll('.current-question').forEach(el => {
                el.classList.remove('current-question');
            });
            document.querySelectorAll('.current-question-column').forEach(el => {
                el.classList.remove('current-question-column');
            });
            
            if (gameState.gameFinished) return;
            
            const questionNumber = getAbsoluteQuestionNumber();
            
            if (gameState.horizontalView) {
                // В горизонтальном режиме подсвечиваем столбец
                const allRows = document.querySelectorAll('#tableBody tr');
                if (allRows.length > 0) {
                    // Пропускаем строку с темами (первая строка)
                    for (let i = 1; i < allRows.length; i++) {
                        const cells = allRows[i].querySelectorAll('td, th');
                        // +1 потому что первый столбец - заголовок
                        if (cells.length > questionNumber + 1) {
                            cells[questionNumber + 1].classList.add('current-question-column');
                        }
                    }
                    document.getElementsByClassName("current-question-column")[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline:"center" });
                }
            } else {
                // В вертикальном режиме подсвечиваем строку
                const questionRow = document.getElementById(`question${questionNumber}`);
                if (questionRow) {
                    questionRow.classList.add('current-question');
                    questionRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Переключение режима исправления
        function toggleEditMode() {
            if (gameState.editMode) {
                // Проверяем, что нет вопросов с несколькими правильными ответами
                if (!validateAnswers()) {
                    return;
                }
            }
            
            gameState.editMode = !gameState.editMode;
            const btn = document.getElementById('editModeBtn');
            btn.classList.toggle('edit-mode');
            btn.textContent = gameState.editMode ? 'Завершить исправление' : 'Режим исправления';
            
            // Добавляем/убираем обработчики кликов на ячейки
            const cells = document.querySelectorAll('#tableBody td[id^="answer"]');
            cells.forEach(cell => {
                if (gameState.editMode) {
                    cell.style.cursor = 'pointer';
                    cell.onclick = handleCellClick;
                } else {
                    cell.style.cursor = '';
                    cell.onclick = null;
                }
            });
            
            // Скрываем сообщение об ошибке при выходе из режима
            if (!gameState.editMode) {
                document.getElementById('warningMessage').style.display = 'none';
            }
        }

        // Проверка, что нет вопросов с несколькими правильными ответами
        function validateAnswers() {
            let isValid = true;
            const warningElement = document.getElementById('warningMessage');
            warningElement.style.display = 'none';
            warningElement.innerHTML = '';
            
            gameState.answers.forEach((questionAnswers, questionIndex) => {
                const correctAnswers = questionAnswers.filter(a => a === true).length;
                if (correctAnswers > 1) {
                    isValid = false;
                    const question = getQuestionByIndex(questionIndex);
                    warningElement.innerHTML += `Вопрос ${question.value} (${question.theme}) имеет ${correctAnswers} правильных ответа!<br>`;
                }
            });
            
            if (!isValid) {
                warningElement.style.display = 'block';
            }
            
            return isValid;
        }

        // Обработка клика по ячейке в режиме исправления
        function handleCellClick(e) {
            if (!gameState.editMode) return;
            
            const idParts = e.target.id.split('_');
            const questionIndex = parseInt(idParts[0].replace('answer', ''));
            const playerIndex = parseInt(idParts[1]);
            
            const currentAnswer = gameState.answers[questionIndex][playerIndex];
            const question = getQuestionByIndex(questionIndex);
            
            // Определяем следующее состояние по циклу: null -> true -> false -> null
            let newAnswer;
            if (currentAnswer === null) {
                newAnswer = true; // Пусто -> Правильно
            } else if (currentAnswer === true) {
                newAnswer = false; // Правильно -> Неправильно
            } else {
                newAnswer = null; // Неправильно -> Пусто
            }
            
            // Обновляем состояние
            gameState.answers[questionIndex][playerIndex] = newAnswer;
            
            // Обновляем очки
            updateScoresAfterEdit(questionIndex, playerIndex, currentAnswer, newAnswer, question.value);
            
            // Обновляем отображение ячейки
            updateCellAppearance(e.target, newAnswer, question.value);
            
            saveGame();
        }

        // Обновление очков после изменения ответа
        function updateScoresAfterEdit(questionIndex, playerIndex, oldAnswer, newAnswer, value) {
            // Убираем влияние старого ответа
            if (oldAnswer === true) {
                gameState.scores[playerIndex] -= value;
            } else if (oldAnswer === false) {
                gameState.scores[playerIndex] += value;
            }
            
            // Добавляем влияние нового ответа
            if (newAnswer === true) {
                gameState.scores[playerIndex] += value;
            } else if (newAnswer === false) {
                gameState.scores[playerIndex] -= value;
            }
            
            updateScoresDisplay();
        }

        // Обновление внешнего вида ячейки
        function updateCellAppearance(cell, answer, value) {
            if (answer === true) {
                cell.textContent = `+${value}`;
                cell.className = 'correct';
            } else if (answer === false) {
                cell.textContent = `-${value}`;
                cell.className = 'incorrect';
            } else {
                cell.textContent = '';
                cell.className = '';
            }
        }

        // Получение вопроса по индексу
        function getQuestionByIndex(index) {
            let counter = 0;
            for (const block of gameData.questionBlocks) {
                for (const question of block.questions) {
                    if (counter === index) return {
                        ...question,
                        theme: block.theme
                    };
                    counter++;
                }
            }
            return null;
        }

    // Функция загрузки игры для конкретного матча

            updateQuestionInfo();

        function show_saved() {
            all_cards = document.getElementById("local_saved_info")
            all_cards.innerHTML = ""
            matches = matchStorage.getAllRoomMatches(gameState.roomId)
            Object.keys(matches).forEach(element => {
                console.log(element, matches[element])

            // Обновление полей ввода игроков
        function updatePlayerInputs() {
            console.log("game data", gameData)
            const inputs = document.querySelectorAll('.player_input');
            inputs.forEach((input, index) => {
                if (gameData.players[index]) {
                    input.value = gameData.players[index];
                }
            });
            update_players_names();
        }

        

        // Получение текущего ID матча
        function getCurrentMatchId() {
            if (typeof gameindex !== 'undefined') {
                return gameindex || 1;
            }
            else {
                return 1;
            }
        }

        function saveGame() {
            const currentMatchId = getCurrentMatchId();
            matchStorage.saveMatchState(gameState.roomId, currentMatchId, gameState, gameData);
            console.log(`Game saved for match: ${currentMatchId}`);
        }

        // Инициализация таблицы
        function initTable() {
            // Инициализируем кнопки управления
            initControlButtons();
            
            // Загружаем сохранённую игру
            // loadGame();
        }
        
        // Обновление информации о текущем вопросе
        function updateQuestionInfo() {
            const questionInfo = document.getElementById('questionInfo');
            
            if (gameState.gameFinished) {
                questionInfo.textContent = "Игра завершена!";
                return;
            }
            else {
                showResetGameOver()
            }
            
            const currentQuestionObj = getCurrentQuestion();
            
            questionInfo.textContent = `Тема ${gameState.currentBlock + 1}/${gameData.questionBlocks.length}: ${currentQuestionObj.theme} | 
                                      Вопрос ${gameState.currentQuestion + 1}/${currentQuestionObj.questions.length} (${currentQuestionObj.current.value} очков)`;
            
            updateQuestionHighlight();
        }
        
        // Получение абсолютного номера вопроса
        function getAbsoluteQuestionNumber() {
            let absoluteNumber = 0;
            for (let i = 0; i < gameState.currentBlock; i++) {
                absoluteNumber += gameData.questionBlocks[i].questions.length;
            }
            return absoluteNumber + gameState.currentQuestion;
        }
        
        // Получение текущего вопроса
        function getCurrentQuestion() {
            const block = gameData.questionBlocks[gameState.currentBlock];
            return {
                theme: block.theme,
                questions: block.questions,
                current: block.questions[gameState.currentQuestion]
            };
        }
        
        // Обновление отображения очков
        function updateScoresDisplay() {
            scores = document.getElementsByClassName("player_input_score")
            gameData.players.forEach((player, index) => {
                // const scoreElement = document.getElementById(`currentScore${index}`);
                scoreElement = scores[index];
                if (scoreElement) {
                    // scoreElement.textContent = gameState.scores[index];
                    scoreElement.value = gameState.scores[index];
                }
            });
        }
        
        // Обработка ответа игрока
        function handleAnswer(playerIndex, isCorrect) {
            if (gameState.gameFinished || gameState.editMode) return;
            
            const absoluteQuestionNumber = getAbsoluteQuestionNumber();
            const question = getCurrentQuestion().current;
            
            // Если игрок уже отвечал на этот вопрос, пропускаем
            if (gameState.answers[absoluteQuestionNumber][playerIndex] !== null) return;
            
            // Записываем ответ
            gameState.answers[absoluteQuestionNumber][playerIndex] = isCorrect;
            
            // Обновляем очки
            const value = isCorrect ? question.value : -question.value;
            gameState.scores[playerIndex] += value;
            updateScoresDisplay();
            
            // Обновляем ячейку в таблице
            const answerCell = document.getElementById(`answer${absoluteQuestionNumber}_${playerIndex}`);
            if (answerCell) {
                answerCell.textContent = isCorrect ? "+" + question.value : "-" + question.value;
                answerCell.classList.add(isCorrect ? 'correct' : 'incorrect');
            }
            
            // Если ответ правильный, переходим к следующему вопросу
            if (isCorrect) {
                setTimeout(nextQuestion, 500);
            }
            
            saveGame();
        }
        
        // Переход к следующему вопросу
        function nextQuestion() {
            if (gameState.editMode) return;
            
            const currentBlock = gameData.questionBlocks[gameState.currentBlock];
            
            if (gameState.currentQuestion < currentBlock.questions.length - 1) {
                gameState.currentQuestion++;
            } else {
                if (gameState.currentBlock < gameData.questionBlocks.length - 1) {
                    gameState.currentBlock++;
                    gameState.currentQuestion = 0;
                } else {
                    // Игра окончена
                    gameState.gameFinished = true;
                    showGameOver();
                }
            }
            
            updateQuestionInfo();
            saveGame();
        }
        
        // Отображение сообщения об окончании игры
        function showGameOver() {
            const gameOverElement = document.getElementById('gameOverMessage');
            if (gameOverElement) {
                gameOverElement.style.display = 'block';
                gameOverElement.textContent = 'Игра завершена! Финальные результаты:';
            }
            
            const saveBtn = document.getElementById('saveResultsBtn');
            if (saveBtn) {
                saveBtn.style.display = 'block';
            }
            
            const questionInfo = document.getElementById('questionInfo');
            if (questionInfo) {
                questionInfo.textContent = 'Игра завершена!';
            }
            
            // Скрываем кнопки управления
            document.getElementById('controlButtons').style.display = 'none';
            document.getElementById('nextQuestionBtn').style.display = 'none';
            // document.getElementById('editModeBtn').style.display = 'none';
        }

        function showResetGameOver() {
            const gameOverElement = document.getElementById('gameOverMessage');
            if (gameOverElement) {
                gameOverElement.style.display = 'none';
                // gameOverElement.textContent = 'Игра завершена! Финальные результаты:';
            }
            
            const saveBtn = document.getElementById('saveResultsBtn');
            if (saveBtn) {
                saveBtn.style.display = 'none';
            }
            
            const questionInfo = document.getElementById('questionInfo');
            if (questionInfo) {
                questionInfo.textContent = 'Игра завершена!';
            }
            
            // Скрываем кнопки управления
            document.getElementById('controlButtons').style.display = 'flex';
            document.getElementById('nextQuestionBtn').style.display = 'flex';
            document.getElementById('editModeBtn').style.display = 'flex';
        }

        
        // Формирование JSON с результатами
        function getGameResults() {
            const results = {
                players: gameData.players,
                scores: gameState.scores,
                answers: [],
                date: new Date().toISOString()
            };
            
            let questionIndex = 0;
            gameData.questionBlocks.forEach(block => {
                block.questions.forEach(question => {
                    results.answers.push({
                        theme: block.theme,
                        value: question.value,
                        playerAnswers: gameState.answers[questionIndex]
                    });
                    questionIndex++;
                });
            });
            
            return results;
        }
        
        // Обработка клавиатуры
        document.addEventListener('keydown', (e) => {
            if (gameState.gameFinished || gameState.editMode) return;
            
            const keyMap = {
                '1': {player: 0, correct: true},
                '2': {player: 1, correct: true},
                '3': {player: 2, correct: true},
                '4': {player: 3, correct: true},
                'q': {player: 0, correct: false},
                'Q': {player: 0, correct: false},
                'й': {player: 0, correct: false},
                'Й': {player: 0, correct: false},
                'w': {player: 1, correct: false},
                'W': {player: 1, correct: false},
                'Ц': {player: 1, correct: false},
                'ц': {player: 1, correct: false},
                'e': {player: 2, correct: false},
                'E': {player: 2, correct: false},
                'У': {player: 2, correct: false},
                'у': {player: 2, correct: false},
                'r': {player: 3, correct: false},
                'R': {player: 3, correct: false},
                'К': {player: 3, correct: false},
                'к': {player: 3, correct: false},
                '0': () => nextQuestion(),
                '`': () => nextQuestion(),
                'ё': () => nextQuestion(),
                'Ё': () => nextQuestion(),
            };
            
            if (keyMap[e.key]) {
                if (typeof keyMap[e.key] === 'function') {
                    keyMap[e.key]();
                } else {
                    const {player, correct} = keyMap[e.key];
                    handleAnswer(player, correct);
                }
            }
        });
        
        // Сохранение результатов
        document.getElementById('saveResultsBtn').addEventListener('click', () => {
            const results = getGameResults();
            const resultsJson = JSON.stringify(results, null, 2);
            
            // Здесь можно отправить результаты на сервер
            console.log("Результаты игры:", resultsJson);
            // alert("Результаты игры сформированы и готовы к отправке на сервер:\n\n" + resultsJson);
            
            // Очистка сохранённой игры
            localStorage.removeItem('quizGameState');
            showResetGameOver()


        });
        
        // Инициализация при загрузке
        window.onload = function() {
            initAnswers(); // Инициализируем структуру ответов
            initTable();   // Создаём таблицу, которая внутри вызовет loadGame()
            init_page()
        };
    </script>

function arraysEqualUnordered(arr1, arr2) {
    if (arr1.length !== arr2.length) return false;
    const sorted1 = [...arr1].sort();
    const sorted2 = [...arr2].sort();
    return sorted1.every((value, index) => value === sorted2[index]);
}

function exportState() {
    const exportData = {
        version: 1,
        timestamp: new Date().toISOString(),
        roomId: gameState.roomId,
        active: active,                         // список активных игроков
        oneGameBlockArray: one_game_block_array, // заблокированные на одну игру
        gameIndex: gameindex,                   // текущий номер игры
        gameData: gameData,                     // структура вопросов/тем
        gameState: gameState,                   // текущее состояние игры (ответы, очки, прогресс)
        allMatches: matchStorage.allMatches     // все сохранённые матчи (история)
    };
    
    const jsonStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([jsonStr], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tournament_${gameState.roomId}_${new Date().toISOString().slice(0,19)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    alert('Состояние сохранено в файл');
}

// Импорт состояния из файла
async function importState(file) {
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            
            // Проверка версии (опционально)
            if (!imported.version || imported.version !== 1) {
                if (!confirm('Файл старой версии. Продолжить загрузку?')) return;
            }
            
            // Подтверждение действия
            if (!confirm('Восстановление заменит все текущие данные. Продолжить?')) return;
            
            // Восстанавливаем основные переменные
            active = imported.active || [];
            one_game_block_array = imported.oneGameBlockArray || [];
            gameindex = imported.gameIndex || 1;
            
            // Обновляем gameData (темы, вопросы)
            Object.assign(gameData, imported.gameData);
            // Обновляем игроков в gameData
            if (imported.gameData.players) gameData.players = imported.gameData.players;
            
            // Обновляем gameState
            Object.assign(gameState, imported.gameState);
            // Восстанавливаем массивы ответов (нужно создать копии)
            if (imported.gameState.answers) {
                gameState.answers = imported.gameState.answers.map(q => [...q]);
            }
            
            // Обновляем локальное хранилище матчей
            matchStorage.allMatches = imported.allMatches || {};
            matchStorage.saveAllMatches();
            
            // Обновляем интерфейс
            UpdateActivePlayer(active);               // обновить список активных игроков
            refreshOneGameBlock();                    // обновить блокировки на одну игру
            
            // Обновляем поля ввода игроков
            updatePlayerInputs();
            update_players_names();                   // обновить gameData.players и таблицу
            
            // Перерисовываем таблицу в соответствии с текущим видом
            if (gameState.horizontalView) {
                renderHorizontalTable();
            } else {
                renderVerticalTable();
            }
            
            // Обновляем очки на панели
            updateScoresDisplay();
            
            // Обновляем номер игры в заголовке
            document.getElementById("game").innerHTML = "Игра "+ gameindex;
            
            // Перезагружаем текущую игру (применит состояние answers, scores и т.д.)
            loadGame(gameindex);
            
            // Обновляем историю игр (если есть)
            GetGameHistory();
            
            // Обновляем веса
            update_weight();
            
            alert('Состояние успешно восстановлено');
        } catch (err) {
            console.error(err);
            alert('Ошибка при чтении файла: ' + err.message);
        }
    };
    reader.readAsText(file);
}

    // Если блок уже находится внутри модального окна — ничего не делаем
    if (panel.closest('.modal-body')) {
        return;
    }

    // Запоминаем оригинальное место
    originalParent = panel.parentNode;
    // Создаём заглушку
    placeholder = document.createElement('div');
    placeholder.className = 'panel-placeholder';
    placeholder.style.height = panel.offsetHeight + 'px';
    placeholder.style.width = panel.offsetWidth + 'px';
    placeholder.innerHTML = 'Блок развёрнут в модальном окне';
    originalParent.replaceChild(placeholder, panel);

    // Скрываем кнопку развёртывания внутри блока
    const expandBtn = panel.querySelector('.panel-expand');
    if (expandBtn) expandBtn.style.display = 'none';

    const body = panel.querySelector('.panel-body');
    const collapseBtn = panel.querySelector('.panel-collapse');
    if (body && body.classList.contains('collapsed')) {
        body.classList.remove('collapsed');
        if (collapseBtn) collapseBtn.classList.remove('rotated');
        // Сохраняем состояние (необязательно)
        saveCollapseState(panel.id, false);
    }

    // Перемещаем блок в модальное окно
    const modalBody = document.querySelector('#modal-overlay .modal-body');
    modalBody.innerHTML = '';
    modalBody.appendChild(panel);

    // Устанавливаем заголовок модалки
    const panelTitle = panel.querySelector('.panel-title')?.innerText || 'Блок';
    document.querySelector('#modal-overlay .modal-title').innerText = panelTitle;

    document.getElementById('modal-overlay').style.display = 'flex';
    movedPanel = panel;
}

// Функция закрытия и возврата блока (исправленная)
function closeModalAndRestore() {
    const modalBody = document.querySelector('#modal-overlay .modal-body');
    const panel = modalBody.querySelector('.panel');
    if (panel && placeholder && originalParent) {
        // Показываем кнопку развёртывания обратно
        const expandBtn = panel.querySelector('.panel-expand');
        if (expandBtn) expandBtn.style.display = '';
        // Возвращаем блок на место заглушки
        originalParent.replaceChild(panel, placeholder);
        placeholder = null;
        originalParent = null;
        movedPanel = null;
    }
    document.getElementById('modal-overlay').style.display = 'none';
}
// Навешиваем обработчики на все кнопки "Развернуть" (они должны быть у каждого блока)
document.querySelectorAll('.panel-expand').forEach(btn => {
    btn.addEventListener('click', (e) => {
        const panel = btn.closest('.panel');
        if (panel && panel.id) {
            expandPanel(panel.id);
        }
    });
});

// Закрытие по крестику
document.querySelector('.modal-close').addEventListener('click', closeModalAndRestore);
// Закрытие по клику на оверлей (но не на контент)
document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) {
        closeModalAndRestore();
    }
});

// Функция сворачивания/разворачивания блока
function togglePanelCollapse(panelId) {
    const panel = document.getElementById(panelId);
    if (!panel) return;
    const body = panel.querySelector('.panel-body');
    const collapseBtn = panel.querySelector('.panel-collapse');
    if (!body || !collapseBtn) return;
    
    body.classList.toggle('collapsed');
    collapseBtn.classList.toggle('rotated');
    
    // Сохраняем состояние свернутости
    saveCollapseState(panelId, body.classList.contains('collapsed'));
}

// Сохранение состояния в localStorage
function saveCollapseState(panelId, isCollapsed) {
    let collapseStates = localStorage.getItem('panels_collapsed');
    collapseStates = collapseStates ? JSON.parse(collapseStates) : {};
    collapseStates[panelId] = isCollapsed;
    localStorage.setItem('panels_collapsed', JSON.stringify(collapseStates));
}

// Восстановление состояния при загрузке
function restoreCollapseStates() {
    const collapseStates = localStorage.getItem('panels_collapsed');
    if (!collapseStates) return;
    const states = JSON.parse(collapseStates);
    for (const [panelId, isCollapsed] of Object.entries(states)) {
        const panel = document.getElementById(panelId);
        if (panel) {
            const body = panel.querySelector('.panel-body');
            const collapseBtn = panel.querySelector('.panel-collapse');
            if (body && collapseBtn) {
                if (isCollapsed) {
                    body.classList.add('collapsed');
                    collapseBtn.classList.add('rotated');
                } else {
                    body.classList.remove('collapsed');
                    collapseBtn.classList.remove('rotated');
                }
            }
        }
    }
}

// Навешиваем обработчики на все кнопки сворачивания
function bindCollapseButtons() {
    document.querySelectorAll('.panel-collapse').forEach(btn => {
        // Убираем старый обработчик, чтобы не дублировать
        btn.removeEventListener('click', handleCollapseClick);
        btn.addEventListener('click', handleCollapseClick);
    });
}

function handleCollapseClick(e) {
    e.stopPropagation(); // Чтобы не конфликтовать с перетаскиванием
    const panel = e.target.closest('.panel');
    if (panel && panel.id) {
        togglePanelCollapse(panel.id);
    }
}

function resizeThemes(newThemeCount) {
    const oldBlocks = gameData.questionBlocks;
    const oldTotalQuestions = oldBlocks.length * 5;
    const newTotalQuestions = newThemeCount * 5;
    
    // 1. Перестраиваем блоки
    const newBlocks = [];
    for (let i = 0; i < newThemeCount; i++) {
        if (i < oldBlocks.length) {
            // Копируем существующий блок (тему)
            newBlocks.push(JSON.parse(JSON.stringify(oldBlocks[i])));
        } else {
            // Новый блок с пустыми вопросами
            newBlocks.push({
                theme: "",
                questions: [
                    { value: 10, text: "Вопрос 1", answer: "" },
                    { value: 20, text: "Вопрос 2", answer: "" },
                    { value: 30, text: "Вопрос 3", answer: "" },
                    { value: 40, text: "Вопрос 4", answer: "" },
                    { value: 50, text: "Вопрос 5", answer: "" }
                ]
            });
        }
    }
    gameData.questionBlocks = newBlocks;
    
    // 2. Перестраиваем answers
    const oldAnswers = gameState.answers;
    const newAnswers = [];
    for (let i = 0; i < newTotalQuestions; i++) {
        if (i < oldAnswers.length) {
            // Копируем ответы для существующего вопроса
            newAnswers.push([...oldAnswers[i]]);
        } else {
            // Новый вопрос – все ответы null
            newAnswers.push(Array(gameData.players.length).fill(null));
        }
    }
    gameState.answers = newAnswers;
    
    // 3. Пересчитываем очки с нуля (на основе сохранённых ответов)
    const newScores = Array(gameData.players.length).fill(0);
    for (let qIdx = 0; qIdx < newTotalQuestions; qIdx++) {
        const blockIdx = Math.floor(qIdx / 5);
        const qInBlock = qIdx % 5;
        const questionValue = gameData.questionBlocks[blockIdx].questions[qInBlock].value;
        const answersForQ = gameState.answers[qIdx];
        if (answersForQ) {
            for (let pIdx = 0; pIdx < answersForQ.length; pIdx++) {
                if (answersForQ[pIdx] === true) {
                    newScores[pIdx] += questionValue;
                } else if (answersForQ[pIdx] === false) {
                    newScores[pIdx] -= questionValue;
                }
            }
        }
    }
    gameState.scores = newScores;
    
    // 4. Корректируем текущий вопрос, если он стал вне диапазона
    const currentAbsolute = gameState.currentBlock * 5 + gameState.currentQuestion;
    if (currentAbsolute >= newTotalQuestions) {
        // Перемещаем на последний вопрос
        gameState.currentBlock = newThemeCount - 1;
        gameState.currentQuestion = 4; // последний вопрос в теме
    }
    
    // 5. Обновляем интерфейс
    updateScoresDisplay();
    if (gameState.horizontalView) {
        renderHorizontalTable();
    } else {
        renderVerticalTable();
    }
    updateQuestionInfo();
    saveGame(); // если есть функция сохранения
}

document.getElementById('applyThemeCountBtn').addEventListener('click', () => {
    const newCount = parseInt(document.getElementById('themeCountSelect').value);
    const currentCount = gameData.questionBlocks.length;
    if (newCount === currentCount) return;
    
    const confirmMsg = `Изменить количество тем с ${currentCount} на ${newCount}? 
Ответы на вопросы, которые останутся, будут сохранены.`;
    if (confirm(confirmMsg)) {
        resizeThemes(newCount);
    }
});


async function GetGameHistoryArray() {
    console.log("/gameresult/{{roomid}}");
    try {
        const response = await fetch("/gameresult/{{roomid}}", {
            headers: { 'Accept': 'application/json' },
            method: "GET"
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        console.log("history", data);
        
        // Гарантируем, что возвращаем массив
        return Array.isArray(data) ? data : [];
    } catch (err) {
        console.error("GetGameHistory failed:", err);
        return []; // при любой ошибке возвращаем пустой массив
    }
}

        }
