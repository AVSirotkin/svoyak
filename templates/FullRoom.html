        body {

            width: 100%;

        .question-info {

            font-weight: bold;
        }

        }

        }

            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;

        .save-results:hover {
            background-color: #388e3c;
        }
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;

            flex-direction: column;

        }
        .player-title {
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .player-header {
            min-width: 100px;
        }
        .question-value {
            font-weight: bold;
        }
        .edit-mode {
            background-color: #ffeb3b !important;

        }
        .mode-buttons {

        .warning {

        }
        .plmover {
            width: 40px
        }
    </style>

    <script>
    // Добавляем систему хранения с привязкой к комнате и матчу
        class MatchStorage {
            constructor() {
                this.STORAGE_KEY = 'tournament_matches';
                this.loadAllMatches();
            }

            loadAllMatches() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                this.allMatches = stored ? JSON.parse(stored) : {};
            }

            saveAllMatches() {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.allMatches));
            }

            getMatchKey(roomId, matchId) {
                return `${roomId}_${matchId}`;
            }

            saveMatchState(roomId, matchId, gameState, gameData) {
                if (!this.allMatches[roomId]) {
                    this.allMatches[roomId] = {};
                }
                this.allMatches[roomId][matchId] = {
                    gameState: {...gameState},
                    gameData: {...gameData, players: [...gameData.players]},
                    timestamp: new Date().toISOString()
                };
                this.saveAllMatches();
            }

            getMatchState(roomId, matchId) {
                return this.allMatches[roomId]?.[matchId] || null;
            }

            getAllRoomMatches(roomId) {
                return this.allMatches[roomId] || {};
            }
        }

                    ]
                }
            ]
        };

        // Состояние игры
        const gameState = {
            currentBlock: 0,
            currentQuestion: 0,
            scores: Array(gameData.players.length).fill(0),
            answers: [],
            gameFinished: false,
            editMode: false,
            horizontalView: false,
            roomId: '{{roomid}}'

        // function resetState() {

        // Инициализация состояния ответов
        function initAnswers() {
            gameState.answers = [];
            gameData.questionBlocks.forEach(block => {
                block.questions.forEach(() => {
                    gameState.answers.push(Array(gameData.players.length).fill(null));
                });
            });
        }

        // Инициализация кнопок управления
        function initControlButtons() {
            const controlButtons = document.getElementById('controlButtons');
            controlButtons.innerHTML = '';
            const keys = "qwerty"
            
            gameData.players.forEach((player, index) => {
                const playerButtons = document.createElement('div');

        // Переключение вида таблицы
        function toggleTableView() {
            gameState.horizontalView = !gameState.horizontalView;
            const btn = document.getElementById('toggleViewBtn');
            
            if (gameState.horizontalView) {
                btn.textContent = 'Вертикальное отображение';
                renderHorizontalTable();
            } else {
                btn.textContent = 'Горизонтальное отображение';
                renderVerticalTable();
            }
            
            updateQuestionHighlight();
        }

        // Рендер горизонтальной таблицы
        function renderHorizontalTable() {
            const table = document.getElementById('scoreTable');
            table.className = 'score-table horizontal';
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');
            
            // Очищаем таблицу
            headerRow.innerHTML = '';
            tableBody.innerHTML = '';
            
            // Создаем строку с темами (блоками)
            const themeRow = document.createElement('tr');
            const emptyThemeCell = document.createElement('th');
            emptyThemeCell.className = 'theme-header';
            themeRow.appendChild(emptyThemeCell);
            
            gameData.questionBlocks.forEach(block => {
                const th = document.createElement('th');
                th.className = 'theme-block';
                th.colSpan = block.questions.length;
                th.textContent = block.theme;
                themeRow.appendChild(th);
            });
            
            tableBody.appendChild(themeRow);
            
            // Создаем строку с номиналами вопросов
            const valueRow = document.createElement('tr');
            const emptyValueCell = document.createElement('th');
            emptyValueCell.className = 'theme-header';
            valueRow.appendChild(emptyValueCell);
            
            gameData.questionBlocks.forEach(block => {
                block.questions.forEach(question => {
                    const td = document.createElement('td');
                    td.className = 'question-value';
                    td.textContent = question.value;
                    valueRow.appendChild(td);
                });
            });
            
            tableBody.appendChild(valueRow);
            
            // Создаем строки для каждого игрока
            gameData.players.forEach((player, playerIndex) => {
                const playerRow = document.createElement('tr');
                
                // Ячейка с именем игрока
                const playerCell = document.createElement('th');
                playerCell.className = 'theme-header';
                playerCell.textContent = player;
                playerRow.appendChild(playerCell);
                
                // Ячейки с ответами игрока
                let questionIndex = 0;
                gameData.questionBlocks.forEach(block => {
                    block.questions.forEach((question, qIndex) => {
                        const td = document.createElement('td');
                        td.id = `answer${questionIndex}_${playerIndex}`;
                        
                        // Восстанавливаем предыдущие ответы
                        if (gameState.answers[questionIndex] && gameState.answers[questionIndex][playerIndex] !== null) {
                            const value = gameState.answers[questionIndex][playerIndex] ? "+" + question.value : "-" + question.value;
                            td.textContent = value;
                            td.classList.add(gameState.answers[questionIndex][playerIndex] ? 'correct' : 'incorrect');
                        }
                        
                        playerRow.appendChild(td);
                        questionIndex++;
                    });
                });
                
                tableBody.appendChild(playerRow);
            });
        }

        // Рендер вертикальной таблицы
        function renderVerticalTable() {
            const table = document.getElementById('scoreTable');
            table.className = 'score-table vertical';
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');
            
            // Очищаем таблицу
            headerRow.innerHTML = '';
            tableBody.innerHTML = '';
            
            // Создаем заголовок с номиналами и игроками
            const thValue = document.createElement('th');
            thValue.className = 'theme-header';
            // thValue.textContent = "Номинал";
            thValue.textContent = " ";
            headerRow.appendChild(thValue);
            
            gameData.players.forEach((player, index) => {
                const th = document.createElement('th');
                th.className = 'player-header';
                th.textContent = player;
                headerRow.appendChild(th);
            });
            
            // Создаем строки с вопросами
            let questionIndex = 0;
            
            gameData.questionBlocks.forEach((block, blockIndex) => {
                block.questions.forEach((question, qIndex) => {
                    // Добавляем разделитель между блоками
                    if (qIndex === 0) {
                        const separator = document.createElement('tr');
                        separator.className = 'block-separator';
                        const td = document.createElement('td');
                        td.colSpan = gameData.players.length + 1;
                        td.textContent = `Тема ${blockIndex + 1}: ${block.theme}`;
                        td.style.fontWeight = 'bold';
                        separator.appendChild(td);
                        tableBody.appendChild(separator);
                    }
                    
                    const row = document.createElement('tr');
                    row.id = `question${questionIndex}`;
                    
                    const tdValue = document.createElement('td');
                    tdValue.className = 'question-value';
                    tdValue.textContent = question.value;
                    row.appendChild(tdValue);
                    
                    // Ячейки для ответов игроков
                    gameData.players.forEach((player, pIndex) => {
                        const td = document.createElement('td');
                        td.id = `answer${questionIndex}_${pIndex}`;
                        
                        // Восстанавливаем предыдущие ответы
                        if (gameState.answers[questionIndex] && gameState.answers[questionIndex][pIndex] !== null) {
                            const value = gameState.answers[questionIndex][pIndex] ? "+" + question.value : "-" + question.value;
                            td.textContent = value;
                            td.classList.add(gameState.answers[questionIndex][pIndex] ? 'correct' : 'incorrect');
                        }
                        
                        row.appendChild(td);

        // Обновление подсветки текущего вопроса
        function updateQuestionHighlight() {
            // Убираем предыдущую подсветку
            document.querySelectorAll('.current-question').forEach(el => {
                el.classList.remove('current-question');
            });
            document.querySelectorAll('.current-question-column').forEach(el => {
                el.classList.remove('current-question-column');
            });
            
            if (gameState.gameFinished) return;
            
            const questionNumber = getAbsoluteQuestionNumber();
            
            if (gameState.horizontalView) {
                // В горизонтальном режиме подсвечиваем столбец
                const allRows = document.querySelectorAll('#tableBody tr');
                if (allRows.length > 0) {
                    // Пропускаем строку с темами (первая строка)
                    for (let i = 1; i < allRows.length; i++) {
                        const cells = allRows[i].querySelectorAll('td, th');
                        // +1 потому что первый столбец - заголовок
                        if (cells.length > questionNumber + 1) {
                            cells[questionNumber + 1].classList.add('current-question-column');
                        }
                    }
                    document.getElementsByClassName("current-question-column")[0].scrollIntoView({ behavior: 'smooth', block: 'center', inline:"center" });
                }
            } else {
                // В вертикальном режиме подсвечиваем строку
                const questionRow = document.getElementById(`question${questionNumber}`);
                if (questionRow) {
                    questionRow.classList.add('current-question');
                    questionRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Переключение режима исправления
        function toggleEditMode() {
            if (gameState.editMode) {
                // Проверяем, что нет вопросов с несколькими правильными ответами
                if (!validateAnswers()) {
                    return;
                }
            }
            
            gameState.editMode = !gameState.editMode;
            const btn = document.getElementById('editModeBtn');
            btn.classList.toggle('edit-mode');
            btn.textContent = gameState.editMode ? 'Завершить исправление' : 'Режим исправления';
            
            // Добавляем/убираем обработчики кликов на ячейки
            const cells = document.querySelectorAll('#tableBody td[id^="answer"]');
            cells.forEach(cell => {
                if (gameState.editMode) {
                    cell.style.cursor = 'pointer';
                    cell.onclick = handleCellClick;
                } else {
                    cell.style.cursor = '';
                    cell.onclick = null;
                }
            });
            
            // Скрываем сообщение об ошибке при выходе из режима
            if (!gameState.editMode) {
                document.getElementById('warningMessage').style.display = 'none';
            }
        }

        // Проверка, что нет вопросов с несколькими правильными ответами
        function validateAnswers() {
            let isValid = true;
            const warningElement = document.getElementById('warningMessage');
            warningElement.style.display = 'none';
            warningElement.innerHTML = '';
            
            gameState.answers.forEach((questionAnswers, questionIndex) => {
                const correctAnswers = questionAnswers.filter(a => a === true).length;
                if (correctAnswers > 1) {
                    isValid = false;
                    const question = getQuestionByIndex(questionIndex);
                    warningElement.innerHTML += `Вопрос ${question.value} (${question.theme}) имеет ${correctAnswers} правильных ответа!<br>`;
                }
            });
            
            if (!isValid) {
                warningElement.style.display = 'block';
            }
            
            return isValid;
        }

        // Обработка клика по ячейке в режиме исправления
        function handleCellClick(e) {
            if (!gameState.editMode) return;
            
            const idParts = e.target.id.split('_');
            const questionIndex = parseInt(idParts[0].replace('answer', ''));
            const playerIndex = parseInt(idParts[1]);
            
            const currentAnswer = gameState.answers[questionIndex][playerIndex];
            const question = getQuestionByIndex(questionIndex);
            
            // Определяем следующее состояние по циклу: null -> true -> false -> null
            let newAnswer;
            if (currentAnswer === null) {
                newAnswer = true; // Пусто -> Правильно
            } else if (currentAnswer === true) {
                newAnswer = false; // Правильно -> Неправильно
            } else {
                newAnswer = null; // Неправильно -> Пусто
            }
            
            // Обновляем состояние
            gameState.answers[questionIndex][playerIndex] = newAnswer;
            
            // Обновляем очки
            updateScoresAfterEdit(questionIndex, playerIndex, currentAnswer, newAnswer, question.value);
            
            // Обновляем отображение ячейки
            updateCellAppearance(e.target, newAnswer, question.value);
            
            saveGame();
        }

        // Обновление очков после изменения ответа
        function updateScoresAfterEdit(questionIndex, playerIndex, oldAnswer, newAnswer, value) {
            // Убираем влияние старого ответа
            if (oldAnswer === true) {
                gameState.scores[playerIndex] -= value;
            } else if (oldAnswer === false) {
                gameState.scores[playerIndex] += value;
            }
            
            // Добавляем влияние нового ответа
            if (newAnswer === true) {
                gameState.scores[playerIndex] += value;
            } else if (newAnswer === false) {
                gameState.scores[playerIndex] -= value;
            }
            
            updateScoresDisplay();
        }

        // Обновление внешнего вида ячейки
        function updateCellAppearance(cell, answer, value) {
            if (answer === true) {
                cell.textContent = `+${value}`;
                cell.className = 'correct';
            } else if (answer === false) {
                cell.textContent = `-${value}`;
                cell.className = 'incorrect';
            } else {
                cell.textContent = '';
                cell.className = '';
            }
        }

        // Получение вопроса по индексу
        function getQuestionByIndex(index) {
            let counter = 0;
            for (const block of gameData.questionBlocks) {
                for (const question of block.questions) {
                    if (counter === index) return {
                        ...question,
                        theme: block.theme
                    };
                    counter++;
                }
            }
            return null;
        }

    // Функция загрузки игры для конкретного матча

        function updatePlayerInputs() {

            const inputs = document.querySelectorAll('.player_input');

        // Получение текущего ID матча
        function getCurrentMatchId() {
            if (typeof gameindex !== 'undefined') {
                return gameindex || 1;
            }
            else {
                return 1;
            }
        }

        function saveGame() {
            const currentMatchId = getCurrentMatchId();
            matchStorage.saveMatchState(gameState.roomId, currentMatchId, gameState, gameData);
            console.log(`Game saved for match: ${currentMatchId}`);
        }

        // Инициализация таблицы
        function initTable() {
            // Инициализируем кнопки управления
            initControlButtons();
            
            // Загружаем сохранённую игру
            loadGame();
        }
        
        // Обновление информации о текущем вопросе
        function updateQuestionInfo() {
            const questionInfo = document.getElementById('questionInfo');
            
            if (gameState.gameFinished) {
                questionInfo.textContent = "Игра завершена!";
                return;
            }
            else {
                showResetGameOver()
            }
            
            const currentQuestionObj = getCurrentQuestion();
            
            questionInfo.textContent = `Тема ${gameState.currentBlock + 1}/${gameData.questionBlocks.length}: ${currentQuestionObj.theme} | 
                                      Вопрос ${gameState.currentQuestion + 1}/${currentQuestionObj.questions.length} (${currentQuestionObj.current.value} очков)`;
            
            updateQuestionHighlight();
        }
        
        // Получение абсолютного номера вопроса
        function getAbsoluteQuestionNumber() {
            let absoluteNumber = 0;
            for (let i = 0; i < gameState.currentBlock; i++) {
                absoluteNumber += gameData.questionBlocks[i].questions.length;
            }
            return absoluteNumber + gameState.currentQuestion;
        }
        
        // Получение текущего вопроса
        function getCurrentQuestion() {
            const block = gameData.questionBlocks[gameState.currentBlock];
            return {
                theme: block.theme,
                questions: block.questions,
                current: block.questions[gameState.currentQuestion]
            };
        }
        
        // Обновление отображения очков
        function updateScoresDisplay() {
            scores = document.getElementsByClassName("player_input_score")
            gameData.players.forEach((player, index) => {
                // const scoreElement = document.getElementById(`currentScore${index}`);
                scoreElement = scores[index];
                if (scoreElement) {
                    // scoreElement.textContent = gameState.scores[index];
                    scoreElement.value = gameState.scores[index];
                }
            });
        }
        
        // Обработка ответа игрока
        function handleAnswer(playerIndex, isCorrect) {
            if (gameState.gameFinished || gameState.editMode) return;
            
            const absoluteQuestionNumber = getAbsoluteQuestionNumber();
            const question = getCurrentQuestion().current;
            
            // Если игрок уже отвечал на этот вопрос, пропускаем
            if (gameState.answers[absoluteQuestionNumber][playerIndex] !== null) return;
            
            // Записываем ответ
            gameState.answers[absoluteQuestionNumber][playerIndex] = isCorrect;
            
            // Обновляем очки
            const value = isCorrect ? question.value : -question.value;
            gameState.scores[playerIndex] += value;
            updateScoresDisplay();
            
            // Обновляем ячейку в таблице
            const answerCell = document.getElementById(`answer${absoluteQuestionNumber}_${playerIndex}`);
            if (answerCell) {
                answerCell.textContent = isCorrect ? "+" + question.value : "-" + question.value;
                answerCell.classList.add(isCorrect ? 'correct' : 'incorrect');
            }
            
            // Если ответ правильный, переходим к следующему вопросу
            if (isCorrect) {
                setTimeout(nextQuestion, 500);
            }
            
            saveGame();
        }
        
        // Переход к следующему вопросу
        function nextQuestion() {
            if (gameState.editMode) return;
            
            const currentBlock = gameData.questionBlocks[gameState.currentBlock];
            
            if (gameState.currentQuestion < currentBlock.questions.length - 1) {
                gameState.currentQuestion++;
            } else {
                if (gameState.currentBlock < gameData.questionBlocks.length - 1) {
                    gameState.currentBlock++;
                    gameState.currentQuestion = 0;
                } else {
                    // Игра окончена
                    gameState.gameFinished = true;
                    showGameOver();
                }
            }
            
            updateQuestionInfo();
            saveGame();
        }
        
        // Отображение сообщения об окончании игры
        function showGameOver() {
            const gameOverElement = document.getElementById('gameOverMessage');
            if (gameOverElement) {
                gameOverElement.style.display = 'block';
                gameOverElement.textContent = 'Игра завершена! Финальные результаты:';
            }
            
            const saveBtn = document.getElementById('saveResultsBtn');
            if (saveBtn) {
                saveBtn.style.display = 'block';
            }
            
            const questionInfo = document.getElementById('questionInfo');
            if (questionInfo) {
                questionInfo.textContent = 'Игра завершена!';
            }
            
            // Скрываем кнопки управления
            document.getElementById('controlButtons').style.display = 'none';
            document.getElementById('nextQuestionBtn').style.display = 'none';
            // document.getElementById('editModeBtn').style.display = 'none';
        }

        function showResetGameOver() {
            const gameOverElement = document.getElementById('gameOverMessage');
            if (gameOverElement) {
                gameOverElement.style.display = 'none';
                // gameOverElement.textContent = 'Игра завершена! Финальные результаты:';
            }
            
            const saveBtn = document.getElementById('saveResultsBtn');
            if (saveBtn) {
                saveBtn.style.display = 'none';
            }
            
            const questionInfo = document.getElementById('questionInfo');
            if (questionInfo) {
                questionInfo.textContent = 'Игра завершена!';
            }
            
            // Скрываем кнопки управления
            document.getElementById('controlButtons').style.display = 'flex';
            document.getElementById('nextQuestionBtn').style.display = 'flex';
            document.getElementById('editModeBtn').style.display = 'flex';
        }

        
        // Формирование JSON с результатами
        function getGameResults() {
            const results = {
                players: gameData.players,
                scores: gameState.scores,
                answers: [],
                date: new Date().toISOString()
            };
            
            let questionIndex = 0;
            gameData.questionBlocks.forEach(block => {
                block.questions.forEach(question => {
                    results.answers.push({
                        theme: block.theme,
                        value: question.value,
                        playerAnswers: gameState.answers[questionIndex]
                    });
                    questionIndex++;
                });
            });
            
            return results;
        }
        
        // Обработка клавиатуры
        document.addEventListener('keydown', (e) => {
            if (gameState.gameFinished || gameState.editMode) return;
            
            const keyMap = {
                '1': {player: 0, correct: true},
                '2': {player: 1, correct: true},
                '3': {player: 2, correct: true},
                '4': {player: 3, correct: true},
                'q': {player: 0, correct: false},
                'Q': {player: 0, correct: false},
                'й': {player: 0, correct: false},
                'Й': {player: 0, correct: false},
                'w': {player: 1, correct: false},
                'W': {player: 1, correct: false},
                'Ц': {player: 1, correct: false},
                'ц': {player: 1, correct: false},
                'e': {player: 2, correct: false},
                'E': {player: 2, correct: false},
                'У': {player: 2, correct: false},
                'у': {player: 2, correct: false},
                'r': {player: 3, correct: false},
                'R': {player: 3, correct: false},
                'К': {player: 3, correct: false},
                'к': {player: 3, correct: false},
                '0': () => nextQuestion(),
                '`': () => nextQuestion(),
                'ё': () => nextQuestion(),
                'Ё': () => nextQuestion(),
            };
            
            if (keyMap[e.key]) {
                if (typeof keyMap[e.key] === 'function') {
                    keyMap[e.key]();
                } else {
                    const {player, correct} = keyMap[e.key];
                    handleAnswer(player, correct);
                }
            }
        });
        
        // Сохранение результатов
        document.getElementById('saveResultsBtn').addEventListener('click', () => {
            const results = getGameResults();
            const resultsJson = JSON.stringify(results, null, 2);
            
            // Здесь можно отправить результаты на сервер
            console.log("Результаты игры:", resultsJson);
            // alert("Результаты игры сформированы и готовы к отправке на сервер:\n\n" + resultsJson);
            
            // Очистка сохранённой игры
            localStorage.removeItem('quizGameState');
            showResetGameOver()


        });
        
        // Инициализация при загрузке
        window.onload = function() {
            initAnswers(); // Инициализируем структуру ответов
            initTable();   // Создаём таблицу, которая внутри вызовет loadGame()
            init_page()
        };
    </script>

        function tab_drag_dragover(){

        e.preventDefault();
        if (row != null){
        console.log(e.target);
        console.log(e.target.parentNode);
        
        let children = Array.from(e.target.parentNode.parentNode.parentNode.children);
        // console.log(row, children);
        if(children.indexOf(e.target.parentNode.parentNode)>children.indexOf(row)){
            e.target.parentNode.parentNode.after(row);
            pls = document.getElementsByClassName("player_input");
            for (var i = 0; i < pls.length; ++i){

                    }
        }

            pls = document.getElementsByClassName("player_input");
            for (var i = 0; i < pls.length; ++i){
                        pls[i].placeholder = "игрок "+ (i+1)
                    }

    function pl_move(plid, pos){
        loc_pl = document.getElementById(`player${plid}`).value
        if (pos > 0){
            for(i = plid; i<plid + pos; i++){
                document.getElementById(`player${i}`).value = document.getElementById(`player${i+1}`).value
            }
            document.getElementById(`player${plid + pos}`).value = loc_pl
        }
        else {
            for(i = plid; i>plid + pos; i--){
                document.getElementById(`player${i}`).value = document.getElementById(`player${i-1}`).value
            }
            document.getElementById(`player${plid + pos}`).value = loc_pl

        }
        update_players_names()
    }

            playersHtml += `
